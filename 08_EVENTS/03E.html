//this is    tell   us  hoe  we  can   use setInterval  and  clearInterval  function  in  js

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Chai aur Javascript</h1>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
</body>
<script>
    const sayDate = function(str){
        console.log(str, Date.now());
    }

    let intervalId;   // yaha bahar declare kiya, taaki dono buttons use kar sake

    // START button — interval shuru karega
    document.getElementById('start').addEventListener('click', function(){
        intervalId = setInterval(sayDate, 1000, "SAM");
    });

    // STOP button — interval ko rokega
    document.getElementById('stop').addEventListener('click', function(){
        clearInterval(intervalId);
    });
</script>
</html>
